<title>Conflict Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
/* Layout: one column, three screens (intro → 30 pairs → result) between a logo header and the WeNego footer.
   Brand: navy + gold only. Two type sizes: --fs-title (Fraunces) and --fs-text (Inter). */
:root{
  --navy:#13213C; --gold:#C9A227;
  --bg:#F5F4F0; --surface:#FFFFFF; --ink:#13213C; --muted:#4D5872; --line:#DCDDE3;
  --gold-ink:#7A6110; --gold-soft:#F4EDD3; --navy-soft:#E7E9EF;
  --m-competing:#13213C; --m-collaborating:#C9A227; --m-compromising:#5E6A86; --m-avoiding:#AEB4C2; --m-accommodating:#E6D08A;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-title:clamp(1.4rem, 2.4vw, 1.85rem);
  --dot-bg:#ECEDF1;
  --fs-text:1rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1628; --surface:#16223A; --ink:#EEF0F5; --muted:#AEB6CA; --line:#2A3858;
  --gold-ink:#D9B748; --gold-soft:#2A2A1E; --navy-soft:#1E2B47;
  --m-competing:#E8EBF2; --m-collaborating:#D4AE35; --m-compromising:#8E9AB8; --m-avoiding:#4E5C7C; --m-accommodating:#8E7525;
  --dot-bg:#24314F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1628; --surface:#16223A; --ink:#EEF0F5; --muted:#AEB6CA; --line:#2A3858;
  --gold-ink:#D9B748; --gold-soft:#2A2A1E; --navy-soft:#1E2B47;
  --m-competing:#E8EBF2; --m-collaborating:#D4AE35; --m-compromising:#8E9AB8; --m-avoiding:#4E5C7C; --m-accommodating:#8E7525;
  --dot-bg:#24314F;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-text);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:16px 48px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em;font-size:var(--fs-title)}
/* everything that isn't a title uses the text size */
p,li,button,small,b,span,summary,q,.eyebrow,.lead{font-size:var(--fs-text)}
h3.t-text,h4.t-text,.t-text{font-family:var(--body);font-size:var(--fs-text);font-weight:600;line-height:1.4;letter-spacing:0}
p{margin:0}
.eyebrow{font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
.lead{color:var(--muted);max-width:62ch}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* header */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:8px 18px;margin-bottom:28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none;color:var(--muted)}
.logo img{height:22px;margin-bottom:3px;width:auto;max-width:none;object-fit:contain;display:block}
.logo span{font-weight:600;font-size:.78rem}
.bar-title{font-family:var(--display);font-weight:600;font-size:1.15rem;text-align:center;margin:0;line-height:1.2}
.bar .lang{justify-self:end}
.lang{display:flex;gap:2px;padding:4px;background:var(--navy-soft);border-radius:999px}
.lang button{background:transparent;border:0;color:var(--muted);padding:6px 18px;border-radius:999px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 28px;font-weight:600;background:var(--ink);color:var(--bg);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{filter:brightness(1.06)}

/* ---------- INTRO ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.hero > *{min-width:0}
.hero .copy{display:flex;flex-direction:column;gap:16px}
.apple{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.apple-q{font-weight:600}
.reply{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center}
.reply .ani{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c);background:var(--surface)}
.reply q{quotes:"« " " »";font-style:italic;display:block}
.reply small{display:block;color:var(--muted)}

.section{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.axes > div{border-top:2px solid var(--gold);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.axes b{font-weight:600}
.axes p{color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mode-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode-card .ani{line-height:1}
.mode-card .tag{color:var(--muted)}
.mode-card p{color:var(--muted);line-height:1.5}

.wide{width:auto}
.howto{font-size:.92rem;background:var(--navy);color:#fff;border-radius:22px;padding:32px 44px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center}
.howto > *{min-width:0}
.howto h2{color:#fff;font-size:1.6rem}
.howto p,.howto span,.howto button,.about p,.about b,.about span,.about a{font-size:.92rem}
.howto p{color:#D3D8E4}
.howto .meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;color:var(--gold);font-weight:600}
.howto .cta{display:flex;justify-content:flex-end}

/* ---------- QUIZ ---------- */
.quiz{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.progress{display:flex;flex-direction:column;gap:10px}
.progress .row{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.track{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.prompt{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.35}
.choices{display:grid;gap:14px}
.choice{display:grid;grid-template-columns:48px 1fr;gap:18px;align-items:center;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;line-height:1.5;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--gold);transform:translateY(-1px)}
.choice .key{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:600;background:var(--navy-soft);color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.choice[aria-pressed="true"] .key{background:var(--gold);color:var(--navy)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:600;padding:8px 0}
.linkbtn:disabled{opacity:.35;cursor:default}

/* ---------- RESULT ---------- */
.res-head{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
#res-lead{max-width:none}
@media (min-width:900px){#res-lead{white-space:nowrap}}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:stretch}
.res-grid > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}

.matrix-wrap{display:grid;grid-template-columns:28px 1fr;grid-template-rows:1fr 28px;gap:6px}
.y-label{position:relative;color:var(--muted);font-weight:600}
.y-label .yl{position:absolute;left:50%;top:50%;width:300px;transform:translate(-50%,-50%) rotate(-90deg);display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.res-grid > .panel{display:flex;flex-direction:column}
.defs{flex:1;justify-content:space-around}
.x-label{grid-column:2;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.y-label small,.x-label small{font-weight:400}
.matrix{position:relative;aspect-ratio:1/1;max-width:100%;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);background:
  linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,
  linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.matrix .lo,.matrix .hi{position:absolute;color:var(--muted)}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;width:34%}
.node .dot{border-radius:50%;display:grid;place-items:center;line-height:1;background:var(--dot-bg);border:1.5px solid var(--line);transition:width .5s,height .5s;box-shadow:0 0 0 4px var(--surface)}
.node b{line-height:1.25}
.node .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

.bars{display:flex;flex-direction:column;gap:16px}
.barrow{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.barrow .name{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:5px}
.barrow .band{padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.barrow .band.high{border-color:transparent;background:var(--gold);color:var(--navy)}
.btrack{height:10px;background:var(--navy-soft);border-radius:999px;overflow:hidden;position:relative}
.btrack i{display:block;height:100%;border-radius:999px;width:0;transition:width .6s}
.btrack::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--muted);opacity:.5}
.barrow .score{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:52px}
.scale-note{color:var(--muted);margin-top:16px;display:flex;gap:8px 20px;flex-wrap:wrap}
.scale-note b{color:var(--ink)}
.scores-panel{margin-top:24px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 40px}
.defs{display:flex;flex-direction:column;gap:14px}
.def{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.def .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--dot-bg);border:1.5px solid var(--line)}
.def b{display:block}
.def p{color:var(--muted);line-height:1.45}
.cta-box{margin-top:28px;border:1.5px solid var(--gold);border-radius:16px;padding:18px 22px;display:flex;gap:16px;align-items:center;background:var(--surface)}
.cta-box .ico{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--dot-bg);color:var(--ink)}
.cta-box a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold)}
body.pdf-mode .actions,body.pdf-mode .lang{visibility:hidden}

.focus{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.focus > *{min-width:0}
.focus .panel{display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--c)}
.focus .kicker{font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.focus h3{display:flex;gap:10px;align-items:center;font-size:1.3rem}
.focus p{color:var(--muted)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

.all{margin-top:36px;display:flex;flex-direction:column;gap:12px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 22px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 0;font-weight:600;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary .sc{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
summary::after{content:"+";color:var(--gold-ink);width:16px;text-align:center}
details[open] summary::after{content:"–"}
.det{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-bottom:22px}
.det > *{min-width:0;display:flex;flex-direction:column;gap:8px}
.det .full{grid-column:1/-1}
.det p{color:var(--muted)}

.quote{margin-top:28px;padding:28px;border-radius:20px;background:var(--gold-soft);border-left:0;display:flex;flex-direction:column;gap:10px}
.quote p{max-width:none}
.actions{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.toast{color:var(--muted);align-self:center}

/* contact step */
.form-card{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:18px}
.form-card .lead{max-width:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.field input:focus{outline:none;border-color:var(--gold)}
.field input[aria-invalid="true"]{border-color:#C0392B}
.form-err{color:#C0392B;font-weight:600;min-height:1.6em}
.form-note{color:var(--muted)}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}.form-card{padding:22px}}

/* footer: WeNego about card */
.site-footer{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
.about{background:var(--navy);color:#fff;border-radius:22px;padding:32px 44px;display:grid;grid-template-columns:minmax(0,1.6fr) auto auto;gap:40px;align-items:center}
.about > *{min-width:0}
.about p{color:#fff;line-height:1.7;max-width:60ch}
.stats{border-left:1px solid rgba(255,255,255,.18);padding-left:40px;display:grid;grid-template-columns:auto auto;column-gap:56px;row-gap:12px}
.stats b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.stats span{color:#B9C3DE}
.about .btn{white-space:nowrap}

@media (max-width:880px){
  .modes{grid-template-columns:repeat(2,1fr)}
  .modes .mode-card:last-child{grid-column:1/-1}
}
@media (max-width:860px){
  .about{grid-template-columns:1fr;gap:24px;padding:28px}
  .stats{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.18);padding-top:20px}
}
@media (max-width:760px){
  .bar{grid-template-columns:1fr auto}
  .bar-title{grid-column:1/-1;grid-row:2;text-align:left}
  .hero,.res-grid,.focus,.howto,.det,.axes,.bars{grid-template-columns:1fr}
  .howto .cta{justify-content:flex-start}
  .howto{padding:24px}
  .choice{grid-template-columns:40px 1fr;padding:18px;gap:14px}
  .choice .key{width:40px;height:40px}
  .node b{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- state ---------- */
let lang="fr", idx=0, answers=new Array(30).fill(null), screen="intro", contact=null;
/* Paste the Web App URL of the Google Apps Script here (Deploy → New deployment → Web app → URL ending in /exec). */
const SHEET_ENDPOINT="https://script.google.com/macros/s/AKfycbwMA1iKH9zhXFRucQhyykmpuIdBKjfLumBxhyk2ScSP8m4JdOqYrLRZjCuXQ5UDU4_YWA/exec";
const $=id=>document.getElementById(id);
const store={get(){try{return JSON.parse(localStorage.getItem("conflictprofile")||"null")}catch(e){return null}},
             set(v){try{localStorage.setItem("conflictprofile",JSON.stringify(v))}catch(e){}}};
function save(){store.set({lang,idx,answers})}

function nb(s){return String(s).replace(/ ([:;?!»%])/g,"\u00a0$1").replace(/« /g,"«\u00a0")}
function t(k){return nb(T[lang][k])}
function band(s){return s>=8?"high":s>=5?"mid":"low"}

function scores(){
  const sc={};MODES.forEach(m=>sc[m]=0);
  answers.forEach((a,i)=>{if(a){const q=Q[i];sc[a==="A"?q[1]:q[3]]++}});
  return sc;
}

/* ---------- render ---------- */
function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $("lang-fr").setAttribute("aria-pressed",lang==="fr");
  $("lang-en").setAttribute("aria-pressed",lang==="en");
  const order=["competing","collaborating","compromising","avoiding","accommodating"];
  $("apple").innerHTML=`<div class="apple-q">${t("appleQ")}</div>`+order.map(m=>{
    const d=M[m][lang];
    return `<div class="reply" style="--c:var(--m-${m})"><span class="ani" aria-hidden="true">${ANI[m]}</span><div><q>${d.say}</q><small>${d.animal} · ${d.name}</small></div></div>`}).join("");
  $("mode-cards").innerHTML=order.map(m=>{
    const d=M[m][lang];
    return `<article class="mode-card" style="--c:var(--m-${m})"><span class="ani" aria-hidden="true">${ANI[m]}</span><span class="tag">${d.tag}</span><h3 class="t-text">${d.name}</h3><p>${d.short}</p></article>`}).join("");
}

function show(s){
  $("about-footer").hidden=s==="quiz"||s==="form";
  $("screen-form").hidden=s!=="form";
  screen=s;
  $("screen-intro").hidden=s!=="intro";
  $("screen-quiz").hidden=s!=="quiz";
  $("screen-result").hidden=s!=="result";
  if(s==="quiz")renderQ();
  if(s==="result")renderResult();
  save();
}

function renderQ(){
  const q=Q[idx];
  $("txt-a").textContent=S[q[0]][lang==="fr"?0:1];
  $("txt-b").textContent=S[q[2]][lang==="fr"?0:1];
  $("choice-a").setAttribute("aria-pressed",answers[idx]==="A");
  $("choice-b").setAttribute("aria-pressed",answers[idx]==="B");
  const done=answers.filter(Boolean).length;
  $("q-count").textContent=`${t("q")} ${idx+1} / 30`;
  $("q-pct").textContent=Math.round(done/30*100)+" %";
  $("q-bar").style.width=(done/30*100)+"%";
  $("back").disabled=idx===0;
}

function pick(opt){
  answers[idx]=opt;
  renderQ();
  setTimeout(()=>{
    const next=answers.findIndex((a,i)=>i>idx&&!a);
    const anyEmpty=answers.findIndex(a=>!a);
    if(idx<29 && (next!==-1||anyEmpty===-1)) {idx=next!==-1?next:idx+1;renderQ();save();}
    else if(anyEmpty!==-1){idx=anyEmpty;renderQ();save();}
    else show("form");
  },220);
  save();
}

function sizeYLabel(){const m=$("matrix"),y=$("yl");if(m&&y&&m.offsetHeight)y.style.width=m.offsetHeight+"px"}
window.addEventListener("resize",sizeYLabel);
function list(arr){return `<ul class="clean">${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`}

function renderResult(){
  const sc=scores();
  const max=Math.max(...MODES.map(m=>sc[m])), min=Math.min(...MODES.map(m=>sc[m]));
  const top=MODES.filter(m=>sc[m]===max), bottom=MODES.filter(m=>sc[m]===min);
  const names=arr=>arr.map(m=>M[m][lang].name).join(` ${t("and")} `);
  $("res-title").textContent=top.map(m=>`${M[m][lang].animal}`).join(" & ")+" "+top.map(m=>ANI[m]).join("");
  $("res-lead").textContent=nb(`${t("resLead1")} ${names(top).toLowerCase()} (${max}/12). ${t("resLead2")} ${names(bottom).toLowerCase()} (${min}/12).`);

  // matrix
  const mx=$("matrix");
  mx.innerHTML=
   MODES.map(m=>{const [x,y]=POS[m];const s=sc[m];const sz=34+s*3.4;const pct=Math.round(s/30*100);
     return `<div class="node" style="left:${x}%;top:${y}%"><span class="dot" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.46)}px" aria-hidden="true">${ANI[m]}</span><b>${M[m][lang].name}</b><span class="pct">${pct} %</span></div>`}).join("");

  sizeYLabel();
  // definitions next to the matrix
  $("defs").innerHTML=["competing","collaborating","compromising","avoiding","accommodating"].map(m=>{const d=M[m][lang];
    return `<div class="def"><span class="ico" aria-hidden="true">${ANI[m]}</span><div><b>${d.name} · <span style="font-weight:400;color:var(--muted)">${d.tag}</span></b><p>${d.short}</p></div></div>`}).join("");

  // bars
  const sorted=[...MODES].sort((a,b)=>sc[b]-sc[a]);
  $("bars").innerHTML=sorted.map(m=>{const s=sc[m],b=band(s);
    return `<div class="barrow"><span class="ani" aria-hidden="true">${ANI[m]}</span><div><div class="name"><span>${M[m][lang].name}</span><span class="band ${b}">${t(b)}</span></div><div class="btrack"><i style="width:${s/12*100}%;background:var(--ink)"></i></div></div><span class="score">${s}/12</span></div>`}).join("");

  // focus
  const tm=top[0], bm=bottom[0];
  const card=(m,kick,qs,qk)=>{const d=M[m][lang];
    return `<div class="panel" style="--c:var(--m-${m})"><span class="kicker">${kick} · ${sc[m]}/12</span><h3><span aria-hidden="true">${ANI[m]}</span>${d.name}</h3><p>${d.desc}</p><h4 class="t-text">${t(qk)}</h4>${list(qs)}</div>`};
  $("focus").innerHTML=card(tm,t("dominant"),M[tm][lang].high,"askHigh")+(bm!==tm?card(bm,t("least"),M[bm][lang].low,"askLow"):"");

  // all modes
  $("all-modes").innerHTML=sorted.map(m=>{const d=M[m][lang];
    return `<details><summary><span class="ani" aria-hidden="true">${ANI[m]}</span>${d.name} <span style="color:var(--muted);font-weight:400">· ${d.animal}</span><span class="sc">${sc[m]}/12 · ${t(band(sc[m]))}</span></summary>
     <div class="det"><div class="full"><h4 class="t-text">${t("descT")}</h4><p>${d.desc}</p></div>
     <div><h4 class="t-text">${t("usefulWhen")}</h4>${list(d.useful)}</div>
     <div><h4 class="t-text">${t("askHigh")}</h4>${list(d.high)}<h4 class="t-text" style="margin-top:10px">${t("askLow")}</h4>${list(d.low)}</div></div></details>`}).join("");
}

async function deliverFile(blob,filename){
  if(window.claude&&typeof window.claude.use==="function"){
    const dl=await window.claude.use("downloads");
    if(dl){try{await dl.save({filename,data:blob});return true}catch(e){if(e&&e.code==="declined")return false}}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
async function buildPdf(scale){
  const el=document.querySelector(".wrap");
  const canvas=await html2canvas(el,{scale:scale||2,backgroundColor:"#F5F4F0",useCORS:true,windowWidth:1240,
    onclone:doc=>{doc.documentElement.setAttribute("data-theme","light");doc.body.classList.add("pdf-mode");
      doc.querySelectorAll("#all-modes details").forEach(d=>d.open=true);
      const r=doc.getElementById("screen-result");if(r)r.hidden=false;}});
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});
  const mg=10,W=210-2*mg,H=297-2*mg,pagePx=Math.floor(canvas.width*H/W);
  for(let y=0,i=0;y<canvas.height;y+=pagePx,i++){
    const hh=Math.min(pagePx,canvas.height-y),c=document.createElement("canvas");c.width=canvas.width;c.height=hh;
    const g=c.getContext("2d");g.fillStyle="#F5F4F0";g.fillRect(0,0,c.width,hh);g.drawImage(canvas,0,y,canvas.width,hh,0,0,canvas.width,hh);
    if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.88),"JPEG",mg,mg,W,hh*W/canvas.width);
  }
  return pdf;
}
function pdfName(){return lang==="fr"?"WeNego-Profil-Conflits.pdf":"WeNego-Conflict-Profile.pdf"}
async function downloadPdf(){
  const btn=$("pdf");btn.disabled=true;$("toast").textContent=t("pdfBusy");
  try{const pdf=await buildPdf(2);const ok=await deliverFile(pdf.output("blob"),pdfName());$("toast").textContent=ok?t("pdfDone"):"";}
  catch(e){console.error(e);$("toast").textContent=t("pdfFail")}
  finally{btn.disabled=false}
}
async function sendSubmission(){
  if(!contact||!/^https:\/\/script\.google\.com\//.test(SHEET_ENDPOINT))return;
  $("toast").textContent=t("sending");
  const sc=scores();
  const max=Math.max(...MODES.map(m=>sc[m])),min=Math.min(...MODES.map(m=>sc[m]));
  let pdfBase64="";
  try{const pdf=await buildPdf(1.5);pdfBase64=pdf.output("datauristring").split(",")[1]}catch(e){console.error(e)}
  const payload={tool:"conflict-profile",lang,...contact,
    scores:Object.fromEntries(MODES.map(m=>[m,sc[m]])),
    labels:Object.fromEntries(MODES.map(m=>[m,M[m][lang].name])),
    dominant:MODES.filter(m=>sc[m]===max).map(m=>M[m][lang].name).join(" / "),
    least:MODES.filter(m=>sc[m]===min).map(m=>M[m][lang].name).join(" / "),
    answers:answers.join(""),pdfBase64,pdfName:pdfName(),pageUrl:location.href};
  try{
    await fetch(SHEET_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    $("toast").textContent=t("sent")+contact.email+".";
  }catch(e){console.error(e);$("toast").textContent="";}
}
function resultText(){
  const sc=scores();
  return [lang==="fr"?"Mon profil Thomas-Kilmann":"My Thomas-Kilmann profile",
    ...[...MODES].sort((a,b)=>sc[b]-sc[a]).map(m=>`${M[m][lang].name} (${M[m][lang].animal}) : ${sc[m]}/12 · ${Math.round(sc[m]/30*100)} %`)].join("\n");
}

/* ---------- events ---------- */
$("f-back").addEventListener("click",()=>{idx=29;show("quiz")});
$("lead-form").addEventListener("submit",e=>{
  e.preventDefault();
  const ids=["f-first","f-last","f-email","f-company"],vals=ids.map(i=>$(i).value.trim());
  ids.forEach((i,k)=>$(i).setAttribute("aria-invalid",vals[k]?"false":"true"));
  if(vals.some(v=>!v)){$("form-err").textContent=t("errRequired");return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(vals[2])){$("f-email").setAttribute("aria-invalid","true");$("form-err").textContent=t("errEmail");return}
  $("form-err").textContent="";
  contact={firstName:vals[0],lastName:vals[1],email:vals[2],company:vals[3]};
  show("result");window.scrollTo(0,0);
  setTimeout(sendSubmission,400);
});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;renderStatic();if(screen==="quiz")renderQ();if(screen==="result")renderResult();save()}));
["start-top","start-bottom"].forEach(id=>$(id).addEventListener("click",()=>{let e=answers.findIndex(a=>!a);if(e===-1){answers=new Array(30).fill(null);e=0}idx=e;show("quiz");window.scrollTo(0,0)}));
$("choice-a").addEventListener("click",()=>pick("A"));
$("choice-b").addEventListener("click",()=>pick("B"));
$("back").addEventListener("click",()=>{if(idx>0){idx--;renderQ();save()}});
$("restart").addEventListener("click",()=>{answers=new Array(30).fill(null);idx=0;show("intro");window.scrollTo(0,0)});
$("pdf").addEventListener("click",downloadPdf);
document.addEventListener("keydown",e=>{
  if(screen!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==="a")pick("A"); else if(k==="b")pick("B");
  else if(k==="arrowleft"&&idx>0){idx--;renderQ();save()}
});

/* ---------- boot ---------- */
const saved=store.get();
if(saved&&Array.isArray(saved.answers)&&saved.answers.length===30){lang=saved.lang||"fr";idx=saved.idx||0;answers=saved.answers;if(answers.every(Boolean)){answers=new Array(30).fill(null);idx=0}}
renderStatic();show("intro");
</script>
